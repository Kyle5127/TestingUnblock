<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unblocked Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:#0f172a;
color:white;
}

header{
padding:18px 25px;
background:#020617;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1e293b;
}

header h1{
font-size:20px;
margin:0;
}

button{
background:#2563eb;
border:none;
color:white;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:18px;
}

.game{
background:#020617;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.2s;
border:1px solid #1e293b;
}

.game:hover{
transform:scale(1.05);
border-color:#2563eb;
}

.game img{
width:100%;
height:120px;
object-fit:cover;
}

.game-title{
padding:10px;
font-size:14px;
}

#player{
display:none;
}

iframe{
width:100%;
height:80vh;
border:none;
border-radius:10px;
background:black;
}

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #1e293b;
background:#020617;
color:white;
}

.loading{
text-align:center;
margin-top:100px;
opacity:.7;
}

</style>
</head>

<body>

<header>
<h1>🎮 Unblocked Games</h1>
<button onclick="goHome()">Home</button>
</header>

<div class="container">

<div id="home">

<div class="search">
<input id="search" placeholder="Search games...">
</div>

<div id="games" class="grid"></div>

<div id="loading" class="loading">Loading games...</div>

</div>

<div id="player">
<h2 id="gameTitle"></h2>
<div id="gameFrame"></div>
<br>
<button onclick="goHome()">⬅ Back to Games</button>
</div>

</div>

<script>

const jsonURL =
"https://raw.githubusercontent.com/swarmintelli/Unblocked-Games-CDN/main/games.json";

let games = [];

async function loadGames(){

const res = await fetch(jsonURL);
const data = await res.json();

games = Object.values(data);

renderGames(games);

document.getElementById("loading").style.display="none";
}

function renderGames(list){

const container = document.getElementById("games");
container.innerHTML="";

list.forEach(game=>{

const card=document.createElement("div");
card.className="game";

card.innerHTML=`
<img src="${game.game_image_icon}">
<div class="game-title">${game.name}</div>
`;

card.onclick=()=>playGame(game);

container.appendChild(card);

});

}

function playGame(game){

document.getElementById("home").style.display="none";
document.getElementById("player").style.display="block";

document.getElementById("gameTitle").innerText=game.name;

document.getElementById("gameFrame").innerHTML=game.iframe;

window.scrollTo(0,0);

}

function goHome(){

document.getElementById("player").style.display="none";
document.getElementById("home").style.display="block";

document.getElementById("gameFrame").innerHTML="";

}

document.getElementById("search").addEventListener("input",e=>{

const q=e.target.value.toLowerCase();

const filtered=games.filter(g=>
g.name.toLowerCase().includes(q)
);

renderGames(filtered);

});

loadGames();

</script>

</body>
</html>
